name: CI producto
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alaira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alaira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alaira
      DATABASE_APP_URL: postgresql://alaira_app:alaira_app_dev@localhost:5432/alaira
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r run lint
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Test
        run: pnpm -r run test
      - name: License audit
        run: pnpm dlx license-checker --summary --onlyAllow "MIT;Apache-2.0;BSD;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense;Python-2.0;BlueOak-1.0.0;CC0-1.0;CC-BY-4.0;PostgreSQL;MPL-2.0;Apache 2.0"
      - name: Vulnerability audit
        run: pnpm audit --audit-level high
      - name: Validate docs
        run: python3 scripts/validate_docs.py
