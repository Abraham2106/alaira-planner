# Perfiles Compose (ver README y ADR-0008):
#   docker compose up -d              → solo PostgreSQL (pruebas de integración M1)
#   docker compose --profile poc-stack up -d     → API, worker y web (+ postgres)
#   docker compose --profile object-storage up -d → emulador S3 local (imagen bloqueada; ver ADR-0008)
#   docker compose --profile poc-stack --profile object-storage up -d → stack POC completo cuando exista emulador

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alaira
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alaira"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO Community Edition OSS archivado (feb 2026); pull de minio/minio denegado.
  # No arranca por defecto. Sustituto pendiente de decisión (ADR-0008 / RR-0003).
  minio:
    profiles: ["object-storage"]
    image: minio/minio:RELEASE.2025-02-07T15-36-18Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["poc-stack"]
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alaira
      DATABASE_APP_URL: postgresql://alaira_app:alaira_app_dev@postgres:5432/alaira
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: alaira-evidence
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["poc-stack"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alaira
      WORKER_POLL_MS: "5000"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: alaira-evidence
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["poc-stack"]
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      VITE_API_BASE: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api
